<section class="task-panel">
  <div class="section-heading">
    <h2>Tarefas</h2>
    @if (loading()) {
      <span class="status-label">Carregando</span>
    }
  </div>

  @if (!loading() && tasks().length === 0) {
    <div class="empty-state">
      <strong>Nenhuma tarefa cadastrada</strong>
      <span>Crie a primeira tarefa para validar a integração com a API.</span>
    </div>
  }

  <div class="task-list">
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        (toggleStatus)="toggleStatus.emit($event)"
        (deleteTask)="deleteTask.emit($event)"
      />
    }
  </div>
</section>
